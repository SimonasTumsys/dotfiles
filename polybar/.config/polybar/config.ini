[colors]
background     = #2c2e34
background-alt = #383c4a
foreground     = #d3dae3
primary        = #5b9bf8
disabled       = #6b7280
alert          = #e06c75

[bar/toph]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

bottom = false
line-size = 6pt
border-size = 0pt

padding-left = 1
padding-right = 1
module-margin = 1

separator = ""

font-0 = CommitMono Nerd Font Mono:size=14;6
font-1 = CommitMono Nerd Font Mono:size=18;6

modules-left = i3
modules-center = date
modules-right =

cursor-click = pointer
enable-ipc = true

wm-restack = i3
override-redirect = false

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

label-focused = ●
label-focused-foreground = ${colors.primary}
label-focused-padding = 1

label-visible = ●
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

label-unfocused = ○
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 1

label-urgent = ●
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 1

date = "%H:%M"
date-alt = "%Y-%m-%d %H:%M:%S"

label = %date%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = true
